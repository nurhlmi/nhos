<h2>Sign in</h2>
<p>Click the button below to verify your email and sign in. The link works once and expires in 10 minutes.</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email"
    style="display:inline-block;padding:10px 18px;border-radius:8px;background:#2f6fe0;color:#ffffff;text-decoration:none;font-weight:600"
    >Verify email and sign in</a
  >
</p>
<p style="color:#6b7280;font-size:12px">If you did not request this, you can ignore this email.</p>
